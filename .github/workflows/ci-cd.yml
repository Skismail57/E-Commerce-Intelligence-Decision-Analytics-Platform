name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Generate synthetic data
      run: |
        python -c "from src.ingestion.generate_synthetic_data import SyntheticDataGenerator; g = SyntheticDataGenerator(); g.generate_all(); g.save_to_csv()"
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml || true
    
    - name: Upload coverage
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        push: false
        tags: ecommerce-intelligence:latest
    
    - name: Build PostgreSQL image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.postgres
        push: false
        tags: ecommerce-postgres:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deployment steps would go here"
        # Add actual deployment commands
        # Could include:
        # - Docker registry push
        # - Kubernetes deployment
        # - Cloud provider deployment
