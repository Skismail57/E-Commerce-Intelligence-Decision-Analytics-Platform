services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_warehouse}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecommerce_pgdata:/var/lib/postgresql/data
      - ./sql/staging/001_create_schema.sql:/docker-entrypoint-initdb.d/01_create_schema.sql:ro
      - ./sql/staging/002_staging_views.sql:/docker-entrypoint-initdb.d/02_staging_views.sql:ro
      - ./sql/transformations/001_advanced_transformation_views.sql:/docker-entrypoint-initdb.d/03_transformation_views.sql:ro
      - ./sql/analytics/001_advanced_analytics.sql:/docker-entrypoint-initdb.d/04_analytics.sql:ro
      - ./sql/kpis/001_executive_kpis.sql:/docker-entrypoint-initdb.d/05_kpis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce_user} -d ${POSTGRES_DB:-ecommerce_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  adminer:
    image: adminer:latest
    container_name: ecommerce-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecommerce-etl
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net
    command: >
      bash -c "python -c \"from src.ingestion.generate_synthetic_data import SyntheticDataGenerator; g = SyntheticDataGenerator(); g.generate_all(); g.save_to_csv();\""

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
    command: >
      uvicorn api.fastapi.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecommerce-streamlit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    networks:
      - ecommerce-net
    command: >
      streamlit run app/streamlit/main.py
      --server.address=0.0.0.0
      --server.port=8501
      --theme.base=dark
      --theme.primaryColor=#7b2ff7

networks:
  ecommerce-net:
    driver: bridge

volumes:
  ecommerce_pgdata:
